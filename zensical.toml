[project]
site_name = "CortexFrame"
site_description = "MATLAB package for fUSI acquisition at the Cortexlab."
site_author = "Samuel Le Meur-Diebolt"
copyright = """Copyright &copy; 2026 Samuel Le Meur-Diebolt"""
repo_url = "https://github.com/sdiebolt/CortexFrame"
repo_name = "sdiebolt/CortexFrame"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
    "javascripts/mermaid.mjs",
    "javascripts/mermaid-zoom.js",
]
nav = [
    { "Home" = "index.md" },
    { "Architecture" = [
        { "Overview" = "architecture/overview.md" },
        { "Event Timeline" = "architecture/event-timeline.md" },
        { "Shared Memory Protocol" = "architecture/shared-memory.md" },
        { "Runtime Control" = "architecture/runtime-control.md" },
    ]},
    { "MATLAB API" = [
        { "Overview" = "api/index.md" },
        { "Sequences" = "api/sequences.md" },
        { "UDP" = "api/udp.md" },
        { "Vantage" = "api/vantage.md" },
        { "Probes" = "api/probes.md" },
        { "RF" = "api/rf.md" },
        { "Utilities" = "api/utilities.md" },
        { "Motor Control" = "api/motor.md" },
        { "GUI" = "api/gui.md" },
    ]},
    { "Python API" = [
        { "Overview" = "api/python/index.md" },
        { "Configuration" = "api/python/config.md" },
        { "Shared Memory" = "api/python/shared_memory.md" },
        { "CLI" = "api/python/cli.md" },
        { "MATLAB Worker" = "api/python/matlab_worker.md" },
        { "Motor Controller" = "api/python/motor_controller.md" },
    ]},
]


# ----------------------------------------------------------------------------
# Section for configuring theme options
# ----------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.tracking",
    "toc.follow",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "content.action.edit",
    "content.action.view",
    "content.tooltips",
    "content.footnote.tooltips"
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings]
default_handler = "matlab"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
    "https://napari.org/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
members_order = "alphabetical"
separate_signature = true
show_source = false
filters = ["!^_"]
show_root_heading = true
show_root_toc_entry = true
show_root_full_path = false
show_object_full_path = false
show_category_heading = false
show_if_no_docstring = false
show_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_symbol_type_toc = true
inherited_members = true
parameter_headings = true
heading_level = 2
summary = true

[project.plugins.mkdocstrings.handlers.matlab]
paths = ["."]
paths_recursive = true

[project.plugins.mkdocstrings.handlers.matlab.options]
docstring_style = "numpy"
docstring_section_style = "list"
members_order = "alphabetical"
parse_arguments = true
separate_signature = true
show_signature_types = true
signature_crossrefs = true
show_source = false
filters = ["!^_"]
show_root_heading = true
show_root_toc_entry = true
show_root_full_path = false
show_object_full_path = false
show_category_heading = false
show_if_no_docstring = false
show_symbol_type_toc = true
inherited_members = true
argument_headings = true
heading_level = 2
summary = true

[project.markdown_extensions.zensical.extensions.glightbox]
auto_caption = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["docs/includes/abbreviations.md"]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.toc]
toc_depth = 3
permalink = true

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.tables]

[project.markdown_extensions.def_list]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
