name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Export MATLAB library path
        run: |
          MATLAB_BIN="$(dirname "$(readlink -f "$(command -v matlab)")")"
          echo "LD_LIBRARY_PATH=${MATLAB_BIN}/glnxa64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run all pre-commit hooks
        run: uv run prek run --all-files

      - name: Type check
        run: uv run ty check src/
